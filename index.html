<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOLT: 5 Days on the Moon</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d1e;--panel:#161a36;--line:#3a4180;--txt:#e8ecff;--dim:#9aa3d4;--pow:#ffcc33;--air:#5dcaff;--shd:#a98bff;--hp:#ff6b8a;--red:#e24b4a;--ok:#5dcaa5}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--txt);font-family:'VT323',monospace;font-size:22px;line-height:1.25;display:flex;justify-content:center}
#app{width:100%;max-width:980px;padding:8px}
#hud{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:6px 10px;background:var(--panel);border:2px solid var(--line)}
.h{font-family:'Press Start 2P',monospace;font-size:12px}
.bar{display:flex;align-items:center;gap:6px}
.bar .t{width:84px;height:14px;background:#000;border:2px solid #555}
.bar .f{height:100%;width:50%;transition:width .6s}
.bar .n{min-width:28px}
#stage{position:relative;margin-top:6px;user-select:none}
canvas{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid var(--line);cursor:pointer}
.lab{position:absolute;font-size:16px;background:rgba(0,0,0,.55);padding:0 4px;pointer-events:none;color:#cfd6ff}
#bottom{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
button{font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.5;background:#2a3170;color:#fff;border:2px solid #7f8ae0;padding:10px 12px;cursor:pointer}
button:hover{background:#3a43a0}
button:active{transform:translateY(2px)}
button.big{font-size:13px;padding:12px 16px;background:#a32d2d;border-color:#ff8a8a}
button:disabled{opacity:.4;cursor:not-allowed}
.pips span{display:inline-block;width:16px;height:22px;margin-right:3px;border:2px solid #9aa3d4;background:#000;vertical-align:middle}
.pips span.on{background:var(--ok)}
#tip{color:var(--dim);margin-top:4px;min-height:26px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
#modal.light{background:transparent;align-items:flex-end;pointer-events:none}
#modal.light #card{pointer-events:auto;margin-bottom:12px}
#card{background:var(--panel);border:3px solid #7f8ae0;max-width:600px;width:100%;padding:14px 16px;max-height:90vh;overflow:auto}
#card h2{font-family:'Press Start 2P',monospace;font-size:14px;line-height:1.6;margin:0 0 10px;color:#fff}
#card p{margin:6px 0}
#card ul{margin:4px 0;padding-left:22px}
.fact{background:#0e1230;border-left:4px solid var(--air);padding:6px 10px;margin:8px 0;color:#cfe8ff}
.fact b{color:var(--air)}
.prob{border:2px solid var(--red);padding:8px;margin:8px 0}
.opt{display:block;width:100%;text-align:left;margin:8px 0 0}
.cost{color:#ffd27a;font-family:'VT323',monospace;font-size:20px}
.src{color:var(--dim);font-size:18px}
#banner{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#a32d2d;color:#fff;font-family:'Press Start 2P',monospace;font-size:11px;padding:6px 10px;display:none;animation:bl 1s steps(2) infinite;pointer-events:none;white-space:nowrap}
@keyframes bl{50%{background:#5a1010}}
#bubble{position:absolute;left:3%;top:22%;max-width:46%;background:#fff;color:#111;padding:6px 10px;border:3px solid #111;display:none;font-size:20px;cursor:pointer}
#bubble:after{content:'';position:absolute;bottom:-12px;left:20px;border:6px solid transparent;border-top-color:#111}
#cap{position:absolute;top:40%;left:0;right:0;text-align:center;font-family:'Press Start 2P',monospace;font-size:22px;color:#fff;text-shadow:3px 3px 0 #000;opacity:0;transition:opacity .5s;pointer-events:none}
#toast{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#0f6e56;color:#fff;padding:4px 10px;border:2px solid #5dcaa5;display:none;pointer-events:none;white-space:nowrap}
#mg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:6;padding:10px}
#mgBox{background:var(--panel);border:3px solid #ffcc33;padding:12px;width:min(680px,96vw)}
#mgTxt{margin:0 0 8px;color:#ffd27a;min-height:28px}
#mgc{width:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:grab;border:2px solid var(--line)}
.title{font-family:'Press Start 2P',monospace;font-size:20px;line-height:1.5;color:var(--pow);margin:4px 0 8px}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="h" id="dayL">DAY 1/5</span>
    <div class="bar"><span style="color:var(--pow)">POWER</span><div class="t"><div class="f" id="fPow" style="background:var(--pow)"></div></div><span class="n" id="nPow"></span></div>
    <div class="bar"><span style="color:var(--air)">AIR</span><div class="t"><div class="f" id="fAir" style="background:var(--air)"></div></div><span class="n" id="nAir"></span></div>
    <div class="bar"><span style="color:var(--shd)">SHIELD</span><div class="t"><div class="f" id="fShd" style="background:var(--shd)"></div></div><span class="n" id="nShd"></span></div>
    <div class="bar"><span style="color:var(--hp)">KAI'S HEALTH</span><div class="t"><div class="f" id="fHp" style="background:var(--hp)"></div></div><span class="n" id="nHp"></span></div>
  </div>
  <div id="stage">
    <canvas id="cv" width="320" height="180"></canvas>
    <div class="lab" style="left:3%;top:40%">MED BAY</div>
    <div class="lab" style="left:31.5%;top:40%">AIR</div>
    <div class="lab" style="left:51.5%;top:40%">BATTERY</div>
    <div class="lab" style="left:77%;top:30%">SOLAR</div>
    <div class="lab" style="left:3%;top:26%">SHIELD</div>
    <div id="banner"></div>
    <div id="bubble"></div>
    <div id="cap"></div>
    <div id="toast"></div>
  </div>
  <div id="bottom">
    <div>BOLT battery: <span class="pips" id="pips"></span></div>
    <button id="bMon">MONITOR</button>
    <button id="bWake">WAKE KAI</button>
    <button id="bEnd" class="big">END DAY</button>
    <button id="bSnd">SOUND: ON</button>
  </div>
  <div id="tip">Tap a room to check on it.</div>
</div>
<div id="modal"><div id="card"></div></div>
<div id="mg"><div id="mgBox"><p class="h" style="font-size:10px;color:var(--dim);margin:0 0 6px">BOLT'S HANDS: REPAIR TIME</p><p id="mgTxt"></p><canvas id="mgc" width="200" height="120"></canvas><button id="mgQuit" style="margin-top:8px">STOP (NO JOB USED)</button></div></div>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const W=320,H=180;let T=0;

/* ---------- real data (historical, saved in the game, not live) ---------- */
const STORMS=[
 {date:'Sep 6, 2017',what:'X9.3 solar flare',power:46,note:'The biggest flare of Solar Cycle 24.'},
 {date:'Sep 10, 2017',what:'X8.2 solar flare and particle storm',power:44,note:'Its fast particles were even measured on the ground on Earth.'},
 {date:'Oct 3, 2024',what:'X9.0 solar flare',power:45,note:'The biggest flare of Solar Cycle 25 at that time.'},
 {date:'May 11, 2024',what:'X5.8 solar flare',power:36,note:'Part of the "Gannon storm" that made auroras visible far from the poles.'},
 {date:'Aug 9, 2011',what:'X6.9 solar flare',power:38,note:'The strongest solar flare of 2011.'},
 {date:'Jul 23, 2012',what:'super fast CME (about 3,000 km per second)',power:42,note:'It just missed Earth. A CME is a giant cloud of hot gas blasted off the Sun.'}
];

const PDEF={
 dust:{mod:'solar',name:'Moon dust on the solar panels',effect:'Panels make half as much power.',fact:'Moon dust is sharp like tiny bits of glass and sticks to everything. Apollo astronauts found it on their suits, their tools, and even in their noses.',fixes:[{t:'Brush the dust off (rub it clean)',a:1,c:{air:4},mg:'dust'}]},
 crack:{mod:'solar',name:'Loose solar panel cable',effect:'Panels make 70% less power.',fact:'On the Moon, sunlight can heat metal to over 100 C and the shade can freeze it below -170 C. Big hot and cold swings make parts grow and shrink, which can shake cables loose. Tiny space rocks called micrometeoroids also hit all the time.',fixes:[{t:'Plug the cable back in (drag the plug)',a:1,c:{air:4},mg:'loose'}]},
 filter:{mod:'air',name:'Clogged air filter',effect:'The oxygen machine makes NO oxygen.',fact:'One person breathes about 0.84 kg of oxygen every day (NASA). The machine has to keep making it, day and night.',fixes:[{t:'Swap in a clean filter (drag it out, drag it in)',a:1,c:{power:4},mg:'filter'}]},
 leak:{mod:'air',name:'Air leak in a pipe',effect:'Lose 8 extra air every night.',fact:'Outside the base is a vacuum: empty space with no air at all. Any tiny hole lets air rush out.',fixes:[{t:'Patch the leak (drag the patch, press it on)',a:1,c:{},mg:'leak'}]},
 gap:{mod:'shield',name:'Crack in the radiation shield',effect:'Shield drops 6 every night, and storms hit harder.',fact:'The Moon has no thick air and no magnetic field to block radiation from the Sun. Covering a base with Moon soil (called regolith) is one way to block it.',fixes:[{t:'Fill the cracks with Moon-soil bags (drag them in)',a:1,c:{power:4},mg:'gap'}]},
 cold:{mod:'battery',name:'Battery is freezing',effect:'Lose 8 power every night.',fact:'In the shade, the Moon can get colder than -170 C. Batteries work badly in the cold, so bases have to keep them warm.',fixes:[{t:'Crank the battery heater (spin the handle)',a:1,c:{power:4},mg:'cold'}]}
};
const BOOST={
 solar:{t:'Turn the panels to face the Sun (+10 power tonight)',a:1,c:{air:4},eff:{solarBonus:10}},
 shield:{t:'Pile on more Moon soil (+15 shield)',a:1,c:{power:5},eff:{shield:15}},
 air:{t:'Run the machine at full speed (+15 air)',a:1,c:{power:10},eff:{air:15}},
 battery:{t:'Turn off extra lights (+8 power)',a:1,c:{hp:3},eff:{power:8}},
 med:{t:'Give Kai a medicine pack (+12 health)',a:1,c:{medkit:1},eff:{hp:12}}
};
const MODINFO={
 solar:{name:'Solar panels',stat:()=>`Panels turn sunlight into power. Tonight they will make about +${prodEst()} power.`,fact:`<b>Real fact:</b> Some hills near the Moon's south pole get sunlight almost all the time. That is one reason NASA's Artemis missions want to go there.`},
 shield:{name:'Radiation shield',stat:()=>`Shield strength: ${S.shield}/100. A stronger shield blocks more radiation in a solar storm.`,fact:`<b>Real fact:</b> On Earth, our air and magnetic field protect us from solar storms. On the Moon, there is nothing, so the base needs its own shield.`},
 air:{name:'Oxygen machine',stat:()=>`Air: ${S.air}/100. Kai uses 14 air every night. The machine makes 20 when it works.`,fact:`<b>Real fact:</b> Every trip outside through the airlock lets a little air escape. That is why outside repairs cost air.`},
 battery:{name:'Battery',stat:()=>`Power: ${S.power}/100. The base uses 28 power every night (air machine, heat, med bed).`,fact:`<b>Real fact:</b> One night on the Moon lasts about 14 Earth days. Bases need big batteries to get through the dark.`},
 med:{name:'Med bay',stat:()=>`Kai's health: ${S.hp}/100. Medicine packs left: ${S.medkits}.`,fact:`<b>Real fact:</b> NASA sets a radiation limit for an astronaut's whole career: 600 millisieverts. That is about as much as 6,000 chest X-rays.`}
};
const DILEMMAS=[
 {title:'Power is low tonight',text:'Kai is asleep. There is not enough power for everything. BOLT must choose alone.',ok:()=>S.power<50,
  a:{t:'Turn off the heater',c:'Kai gets cold: -8 health',f:()=>{S.hp-=8}},
  b:{t:'Turn off the oxygen machine for the night',c:'-15 air',f:()=>{S.air-=15}}},
 {title:'Space rock warning',text:'Sensors spot a shower of tiny space rocks. (In 2013, NASA cameras saw a space rock hit the Moon and flash so bright you could see it from Earth.)',
  a:{t:'Fold the solar panels down',c:'Safe, but -10 power',f:()=>{S.power-=10}},
  b:{t:'Leave them up and hope',c:'50% chance a panel cracks',f:()=>{if(Math.random()<.5){addProblem('crack');toast('Crack! A rock hit the panel.')}else toast('Phew, the rocks missed!')}}},
 {title:'Kai is in pain',text:'Kai wakes up hurting and asks BOLT for help.',ok:()=>S.medkits>0,
  a:{t:'Use a medicine pack',c:'+10 health, uses 1 of your few packs',f:()=>{S.hp+=10;S.medkits--}},
  b:{t:'Stay and keep Kai calm all night',c:'+4 health, but BOLT starts tomorrow with 1 less battery bar',f:()=>{S.hp+=4;S.boltPenalty=1}}},
 {title:'Static dust storm',text:'At sunrise and sunset, Moon dust can get an electric charge and float up. A dust cloud is drifting toward the panels.',
  a:{t:'Cover the panels tonight',c:'-8 power',f:()=>{S.power-=8}},
  b:{t:'Let it pass',c:'Dust may cover the panels (70%)',f:()=>{if(Math.random()<.7)addProblem('dust')}}}
];

/* ---------- state ---------- */
const DAYS=5;
const S={mode:'title',introStep:0,day:1,power:75,air:75,shield:60,hp:60,bolt:3,boltMax:3,problems:[],storms:[],medkits:3,endT:0,endShown:false,ppl:[],flame:false,botHop:0,said:{},wakeUsed:false,solarBonus:0,recur:false,stormFx:0,shake:0,flash:0,nightA:0,nightT:0,kaiAwake:0,kaiInBed:false,survived:[],hover:null,busy:false,boltPenalty:0,astro:null,win:false,shipY:-30};
const has=t=>S.problems.includes(t);
function addProblem(t){if(!has(t))S.problems.push(t)}
function clampAll(){for(const k of['power','air','shield','hp'])S[k]=Math.max(0,Math.min(100,Math.round(S[k])));if(S.medkits<0)S.medkits=0}
function prodEst(){let p=34+S.solarBonus;if(has('dust'))p*=.5;if(has('crack'))p*=.3;return Math.round(p)}
function estPower(){return prodEst()-28-(has('cold')?8:0)}
function estAir(){const make=(has('filter')||S.power+estPower()<=0)?0:20;return make-14-(has('leak')?8:0)}
const sgn=n=>(n>=0?'+':'')+n;

/* ---------- sound ---------- */
let AC=null,muted=false;
function snd(f,d=.1,type='square',v=.05,slide=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function alarm(n=8){for(let i=0;i<n;i++)setTimeout(()=>snd(i%2?620:880,.2,'sawtooth',.035),i*220)}

/* ---------- background music: chiptune made in code, one track per situation ---------- */
const MIDI=n=>440*Math.pow(2,(n-69)/12);
const TR={
 title:{bpm:80,ch:[[64,1],[60,0],[67,0],[62,0]],arp:[0,2,3,4,3,2,1,null],oct:0,lead:'sine',lv:.08,len:1.2,bas:[1,0,0,0,0,0,0,0],bw:'triangle',bv:.12,blen:7,pad:1,pv:.025,h:[0,0,0,0,0,0,1,0],hv:.015},
 base:{bpm:96,ch:[[60,0],[57,1],[53,0],[55,0]],arp:[0,2,3,2,4,2,3,2],oct:12,lead:'triangle',lv:.06,len:.7,bas:[1,0,0,0,1,0,2,0],bw:'triangle',bv:.13,k:[1,0,0,0,1,0,0,0],kv:.1,h:[0,0,1,0,0,0,1,0],hv:.02},
 repair:{bpm:138,ch:[[60,0],[55,0],[57,1],[53,0]],arp:[3,5,4,5,3,5,6,5],oct:0,lead:'square',lv:.03,len:.6,bas:[1,2,1,2,1,2,1,2],bw:'triangle',bv:.13,blen:.6,k:[1,0,0,0,1,0,0,0],kv:.2,sn:[0,0,1,0,0,0,1,0],sv:.07,h:[1,1,1,1,1,1,1,1],hv:.02},
 alert:{bpm:116,ch:[[57,1],[53,0],[57,1],[52,0]],arp:[0,null,2,null,0,null,3,null],oct:12,lead:'square',lv:.035,len:.4,bas:[1,1,1,1,1,1,1,1],bw:'sawtooth',bv:.045,blen:.5,k:[1,0,0,0,1,0,0,0],kv:.16,h:[0,0,1,0,0,0,1,0],hv:.025},
 storm:{bpm:152,ch:[[62,1],[58,0],[55,1],[57,0]],arp:[0,1,2,3,2,1,0,1],oct:12,lead:'sawtooth',lv:.03,len:.5,bas:[1,1,2,1,1,1,2,1],bw:'square',bv:.05,blen:.5,k:[1,0,1,0,1,0,1,0],kv:.22,sn:[0,0,1,0,0,0,1,1],sv:.09,h:[1,1,1,1,1,1,1,1],hv:.025},
 night:{bpm:66,ch:[[57,1],[53,0],[60,0],[55,0]],arp:[null,null,4,null,null,3,null,null],oct:12,lead:'sine',lv:.05,len:2,bas:[1,0,0,0,0,0,0,0],bw:'sine',bv:.12,blen:7,pad:1,pv:.025},
 win:{bpm:132,ch:[[60,0],[65,0],[67,0],[60,0]],arp:[0,1,2,3,2,3,4,5],oct:12,lead:'square',lv:.03,len:.7,bas:[1,0,2,0,1,0,2,0],bw:'triangle',bv:.14,k:[1,0,0,0,1,0,0,0],kv:.18,sn:[0,0,1,0,0,0,1,0],sv:.07,h:[0,1,0,1,0,1,0,1],hv:.02},
 lose:{bpm:60,ch:[[57,1],[62,1],[52,0],[57,1]],arp:[2,null,1,null,0,null,null,null],oct:12,lead:'triangle',lv:.06,len:1.8,bas:[1,0,0,0,0,0,0,0],bw:'sine',bv:.12,blen:7,pad:1,pv:.02}
};
const mus={cur:null,step:0,next:0,timer:null,gain:null};
let noiseBuf=null;
function musInit(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
 if(!mus.gain){mus.gain=AC.createGain();mus.gain.gain.value=muted?0:.55;mus.gain.connect(AC.destination)}
 if(!mus.timer)mus.timer=setInterval(musTick,25)}catch(e){}}
function setMusic(n){if(mus.cur===n)return;mus.cur=n;mus.step=0;if(AC){mus.next=AC.currentTime+.08;if(mus.gain){const g=mus.gain.gain,t=AC.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(0,t);g.linearRampToValueAtTime(muted?0:.55,t+.4)}}}
function musTick(){if(!AC||!mus.cur||AC.state!=='running')return;const tr=TR[mus.cur],sp=60/tr.bpm/2;
 if(mus.next<AC.currentTime)mus.next=AC.currentTime+.02;
 while(mus.next<AC.currentTime+.15){playStep(tr,mus.step,mus.next,sp);mus.step=(mus.step+1)%32;mus.next+=sp}}
function mtone(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mus.gain);o.start(t);o.stop(t+d+.05)}
function mnoise(t,d,v,hp){if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*.5|0,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(mus.gain);s.start(t);s.stop(t+d+.02)}
function mkick(t,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g);g.connect(mus.gain);o.start(t);o.stop(t+.2)}
function playStep(tr,s,t,sp){const[root,mi]=tr.ch[s>>3],k=s&7,th=mi?3:4,tones=[0,th,7,12,12+th,19,24];
 const a=tr.arp[k];if(a!=null)mtone(MIDI(root+tr.oct+tones[a]),t,sp*(tr.len||.9),tr.lead,tr.lv);
 const b=tr.bas[k];if(b)mtone(MIDI(root-12+(b===2?12:0)),t,sp*(tr.blen||.9),tr.bw,tr.bv);
 if(tr.pad&&k===0)for(const i of[0,th,7])mtone(MIDI(root+12+i),t,sp*8,'sine',tr.pv);
 if(tr.k&&tr.k[k])mkick(t,tr.kv);if(tr.sn&&tr.sn[k])mnoise(t,.12,tr.sv,1500);if(tr.h&&tr.h[k])mnoise(t,.04,tr.hv,7000)}
function wantedTrack(){
 if(MG)return'repair';
 if(S.mode==='title')return'title';
 if(S.mode==='intro')return S.introStep===1||S.introStep===2?'storm':'title';
 if(S.mode==='end')return S.win?'win':'lose';
 if(S.stormFx>0)return'storm';
 if(bot.out)return'repair';
 if(S.nightA>.3)return'night';
 if(stormSoon())return'alert';
 return'base'}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,musInit));

/* ---------- scenery ---------- */
const stars=[...Array(45)].map(()=>[Math.random()*320|0,Math.random()*54|0,Math.random()*6]);
const speck=[...Array(140)].map(()=>[Math.random()*320|0,60+Math.random()*120|0]);
const dustPx=[...Array(150)].map(()=>[Math.random()*68|0,Math.random()*12|0]);
function R(c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function circ(cx,cy,r,c){for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(r*r-y*y));R(c,cx-w,cy+y,w*2+1,1)}}

/* ---------- robot ---------- */
const bot={x:50,out:false,state:'idle',tx:50,work:0,goOut:false,cb:null,spot:null};
const SPOT={med:{x:72,sx:40,sy:128},air:{x:118,sx:144,sy:96},battery:{x:212,sx:195,sy:112},shield:{x:110,sx:116,sy:68},solar:{x:224,sx:272,sy:42}};
function sendBot(m,cb){if(bot.out){bot.out=false;bot.x=224}bot.tx=SPOT[m].x;bot.goOut=m==='solar';bot.spot=SPOT[m];bot.cb=cb;bot.state='walk'}
function updBot(dt){
 if(bot.state==='walk'){const d=bot.tx-bot.x,st=110*dt;
  if(Math.abs(d)<=st){bot.x=bot.tx;if(bot.goOut&&!bot.out){bot.out=true;bot.x=258;snd(260,.25,'triangle',.05,-120)}bot.state='work';bot.work=.9}
  else{bot.x+=Math.sign(d)*st;bot.stepT=(bot.stepT||0)+dt;if(bot.stepT>.16){bot.stepT=0;snd(150,.03,'square',.012)}}}
 else if(bot.state==='work'){bot.work-=dt;if(Math.random()<.6)spark(bot.spot.sx,bot.spot.sy);if(Math.random()<.2)snd(1100+Math.random()*700,.03,'square',.015);
  if(bot.work<=0){bot.state='idle';if(bot.out){bot.out=false;bot.x=222}const cb=bot.cb;bot.cb=null;cb&&cb()}}
}

 T+=dt;updBot(dt);
 if(S.mode==='play'&&S.hp<35&&S.kaiInBed){S.hbT=(S.hbT||0)+dt;if(S.hbT>.9){S.hbT=0;snd(990,.06,'sine',.03)}}
 if(S.shake>0)S.shake-=dt;S.flash=Math.max(0,S.flash-dt*1.5);S.kaiAwake-=dt;
 S.nightA+=(S.nightT-S.nightA)*Math.min(1,dt*3);
 if(S.mode==='play'||S.mode==='end'){
  if(has('leak')&&Math.random()<.35)puff(145,88,'#dfe8ff',35+Math.random()*25,(Math.random()-.5)*14);
  if(has('filter')&&Math.random()<.18)puff(136+Math.random()*12,110,'#222',(Math.random()-.5)*6,-14,3);
  if(has('crack')&&Math.random()<.1)spark(272,40);
  if(has('cold')&&Math.random()<.08)puff(178+Math.random()*34,82,'#bfeaff',0,10,1);
 }
 if(S.stormFx>0){S.stormFx-=dt;for(let k=0;k<4;k++)P.push({x:28+Math.random()*8,y:22+Math.random()*6,vx:30+Math.random()*190,vy:42+Math.random()*10,life:4,c:Math.random()<.5?'#ffdd55':'#ff7a3a',storm:true,sz:1})}
 for(const p of P){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.life-=dt;
  if(p.storm&&!p.passed&&p.y>=58){
   if(p.x>234||p.x<8){if(p.y>60)p.life=0}
   else{const nearGap=has('gap')&&(Math.abs(p.x-65)<5||Math.abs(p.x-174)<5);
    const pass=nearGap||Math.random()>(S.shield/100)*.9+.08;
    if(pass&&S.mode!=='intro'){p.passed=true;p.c='#ff3a3a'}else{p.life=0;if(Math.random()<.3)P.push({x:p.x,y:58,vx:0,vy:-12,life:.2,c:'#fff',sz:1})}}}
  if(p.passed&&p.y>150)p.life=0}
 P=P.filter(p=>p.life>0&&p.y<185);
 if(S.astro&&S.astro.run){S.astro.x+=dt*24;if(S.astro.x>=226){S.astro.run=false;S.astro.down=true;S.shake=.8;snd(90,.3,'sawtooth',.06)}}
 if(S.mode==='end'&&S.win)endAnim(dt);
}

/* ---------- actions ---------- */
function openModule(m){
 if(S.busy||S.mode!=='play')return;snd(520,.05,'square',.04);
 const probs=S.problems.filter(t=>PDEF[t].mod===m);
 let h=`<h2>${MODINFO[m].name.toUpperCase()}</h2><p>${MODINFO[m].stat()}</p>`;const btns=[];
 if(!probs.length)h+=`<p style="color:var(--ok)">No problems here right now.</p>`;
 for(const t of probs){const d=PDEF[t];h+=`<div class="prob"><b style="color:#ff8a8a">! ${d.name}</b><br>${d.effect}<div class="fact"><b>Why?</b> ${d.fact}</div></div>`;
  for(const f of d.fixes)btns.push({label:`FIX: ${f.t}<br><span class="cost">Costs: ${costText(f)}</span>`,v:{kind:'fix',t,f},disabled:S.bolt<f.a})}
 const b=BOOST[m];if(b)btns.push({label:`${b.t}<br><span class="cost">Costs: ${costText(b)}</span>`,v:{kind:'boost',m,b},disabled:S.bolt<b.a||(b.c.medkit&&S.medkits<1)});
 h+=`<div class="fact">${MODINFO[m].fact}</div>`;
 if(S.bolt<1)h+=`<p style="color:#ffd27a">BOLT is out of battery today. Tap END DAY to recharge.</p>`;
 btns.push({label:'CLOSE',v:null});
 card(h,btns).then(v=>{if(v)doAction(m,v)});
}
async function doAction(m,v){
 const f=v.kind==='fix'?v.f:v.b;
 if(f.mg){S.busy=true;const ok=await miniGame(f.mg);S.busy=false;if(!ok){toast('Not fixed yet.');return}}
 S.bolt-=f.a;S.busy=true;updHUD();
 sendBot(m,()=>{
  for(const k in f.c){if(k==='medkit')S.medkits-=f.c[k];else S[k]-=f.c[k]}
  if(v.kind==='fix'){S.problems=S.problems.filter(x=>x!==v.t);if(f.again)S.recur=true;toast('Fixed: '+PDEF[v.t].name)}
  else{const e=v.b.eff;if(e.solarBonus)S.solarBonus+=e.solarBonus;for(const k of['power','air','shield','hp'])if(e[k])S[k]+=e[k];toast('Done!')}
  clampAll();S.busy=false;snd(880,.08,'square',.04);setTimeout(()=>snd(1320,.12,'square',.04),90);updHUD();
  if(S.hp<=0)endGame(false);
 });
}
function hint(){
 const s=stormSoon();
 if(s&&(S.shield<70||has('gap')))return`A solar storm is coming! Make the shield strong first. Radiation is the biggest danger.`;
 if(S.air<40||has('leak')||has('filter'))return`Check the air, BOLT! People can only last a few minutes without oxygen.`;
